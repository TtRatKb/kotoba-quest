name: Temporary curated particle options
on:
  push:
    branches:
      - feature/applied-reviews-safe-20261018
    paths:
      - .github/workflows/temporary-curated-particles.yml
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Use only pre-existing contextual contrasts
        run: |
          node <<'PATCH'
          const fs=require("fs"), cp=require("child_process"),assert=require("assert/strict");
          const expected="d10e84cd8b67575badf8f1a1cf736ba20a84e5e8";
          assert.equal(cp.execFileSync("git",["hash-object","cloud.html"],{encoding:"utf8"}).trim(),expected);
          const file=fs.readFileSync("cloud.html","utf8");
          const before="        const pool=[\n          ...(contrastCase?.choices||[]),...(point.distractors||[]),...nearby,\n          \"は\",\"が\",\"を\",\"に\",\"で\",\"へ\",\"と\",\"の\",\"から\",\"まで\",\"も\",\"や\",\n          \"だけ\",\"しか\",\"でも\",\"か\",\"について\",\"にとって\",\"によって\",\"として\"\n        ];\n";
          const after="        const pool=[...(contrastCase?.choices||[]),...(point.distractors||[]),...nearby];\n";
          assert.equal(file.split(before).length-1,1,"one curated-distractor edit expected");
          fs.writeFileSync("cloud.html",file.replace(before,after),"utf8");
          
          PATCH
      - name: Test and commit
        run: |
          node --test tests/review-ui-audio.test.mjs tests/applied-particle-review.test.mjs
          git diff --check
          test "$(git diff --name-only)" = "cloud.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud.html
          git commit -m "refactor: use curated particle distractors only"
          git push origin HEAD:feature/applied-reviews-safe-20261018
