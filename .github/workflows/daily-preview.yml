name: Kotoba Daily preview regression

on:
  pull_request:
    paths:
      - "daily.html"
      - "daily.css"
      - "daily.js"
      - "daily-engine.mjs"
      - "daily-guided.mjs"
      - "daily-mix.mjs"
      - "tests/daily-mix.test.mjs"

      - "daily-guided-variety.mjs"
      - "tests/daily-variety.test.mjs"
      - "tests/daily-guided.test.mjs"
      - "daily-streak.mjs"
      - "dungeon-nav.js"
      - "tests/daily-*.test.mjs"
      - ".github/workflows/daily-preview.yml"
  push:
    branches: [main]
    paths:
      - "daily.html"
      - "daily.css"
      - "daily.js"
      - "daily-engine.mjs"
      - "daily-guided.mjs"
      - "daily-mix.mjs"
      - "tests/daily-mix.test.mjs"

      - "daily-guided-variety.mjs"
      - "tests/daily-variety.test.mjs"
      - "tests/daily-guided.test.mjs"
      - "daily-streak.mjs"
      - "dungeon-nav.js"
      - "tests/daily-*.test.mjs"
      - ".github/workflows/daily-preview.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check daily.js && node --check daily-engine.mjs && node --check daily-mix.mjs

      - run: node --check daily-guided.mjs && node --check daily-guided-variety.mjs
      - run: node --test tests/*.test.mjs
