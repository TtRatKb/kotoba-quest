name: Kotoba Daily preview regression

on:
  pull_request:
    paths:
      - "daily.html"
      - "daily.css"
      - "daily.js"
      - "daily-engine.mjs"
      - "daily-play.mjs"
      - "daily-play-view.mjs"
      - "daily-feedback.mjs"
      - "assets/daily/**"
      - "daily-quality.mjs"
      - "daily-contexts.mjs"
      - "content/daily/contexts-v*.mjs"
      - "scripts/validate-daily-original-contexts.mjs"
      - "daily-furigana.mjs"
      - "daily-kanji-map.mjs"
      - "daily-guided.mjs"
      - "daily-mix.mjs"
      - "tests/daily-mix.test.mjs"

      - "daily-guided-variety.mjs"
      - "tests/daily-variety.test.mjs"
      - "tests/daily-guided.test.mjs"
      - "daily-streak.mjs"
      - "daily-vocab-srs-gateway.mjs"
      - "daily-streak-store.mjs"
      - "scripts/audit-daily-streak-isolation.mjs"
      - "daily-completion.mjs"
      - "daily-practice.mjs"
      - "daily-input.mjs"
      - "japanese-romaji.js"
      - "cloud.html"
      - "index.html"
      - "dungeon-nav.js"
      - "daily-navigation.js"
      - "daily-navigation.css"
      - "cloud.html"
      - "index.html"
      - "tests/daily-*.test.mjs"
      - "tests/browser/daily-*.cjs"
      - ".github/workflows/daily-preview.yml"
  push:
    branches: [main]
    paths:
      - "daily.html"
      - "daily.css"
      - "daily.js"
      - "daily-engine.mjs"
      - "daily-play.mjs"
      - "daily-play-view.mjs"
      - "daily-feedback.mjs"
      - "assets/daily/**"
      - "daily-quality.mjs"
      - "daily-contexts.mjs"
      - "content/daily/contexts-v*.mjs"
      - "scripts/validate-daily-original-contexts.mjs"
      - "daily-furigana.mjs"
      - "daily-kanji-map.mjs"
      - "daily-guided.mjs"
      - "daily-mix.mjs"
      - "tests/daily-mix.test.mjs"

      - "daily-guided-variety.mjs"
      - "tests/daily-variety.test.mjs"
      - "tests/daily-guided.test.mjs"
      - "daily-streak.mjs"
      - "daily-vocab-srs-gateway.mjs"
      - "daily-streak-store.mjs"
      - "scripts/audit-daily-streak-isolation.mjs"
      - "daily-completion.mjs"
      - "daily-practice.mjs"
      - "daily-input.mjs"
      - "japanese-romaji.js"
      - "cloud.html"
      - "index.html"
      - "dungeon-nav.js"
      - "daily-navigation.js"
      - "daily-navigation.css"
      - "cloud.html"
      - "index.html"
      - "tests/daily-*.test.mjs"
      - "tests/browser/daily-*.cjs"
      - ".github/workflows/daily-preview.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check daily.js && node --check daily-engine.mjs && node --check daily-mix.mjs && node --check daily-completion.mjs && node --check daily-practice.mjs

      - run: node --check daily-guided.mjs && node --check daily-guided-variety.mjs
      - run: node --check daily-play.mjs && node --check daily-play-view.mjs && node --check daily-feedback.mjs
      - run: node --test tests/*.test.mjs
      - run: node scripts/validate-daily-original-contexts.mjs
      - run: node scripts/audit-daily-streak-isolation.mjs
