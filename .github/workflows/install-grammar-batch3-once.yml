name: Install vetted grammar batch 3 (one-time)
on:
  push:
    branches:
      - feat/grammar-bank-batch3-audit
    paths:
      - ".github/workflows/install-grammar-batch3-once.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard input SHA and install reviewed content only
        run: node scripts/apply-grammar-temporal-batch3.cjs
      - name: Verify all regression tests
        run: node --test tests/*.test.mjs
      - name: Remove temporary audit and installer files
        run: |
          git rm -r .review-audit
          git rm .github/workflows/inspect-review-bank-once.yml
          git rm .github/workflows/install-grammar-batch3-once.yml
          git rm scripts/apply-grammar-temporal-batch3.cjs
      - name: Commit validated content (no progress code)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud.html grammar/temporal-review-bank-batch3.json
          git diff --cached --check
          git commit -m "feat: add nine temporal grammar clozes and fix particle context"
          git push origin HEAD:feat/grammar-bank-batch3-audit
