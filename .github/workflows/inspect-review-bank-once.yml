name: Inspect grammar and particle source (one-time)
on:
  push:
    branches:
      - feat/grammar-bank-batch3-audit
    paths:
      - ".github/workflows/inspect-review-bank-once.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract read-only content inventory
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const src=fs.readFileSync('cloud.html','utf8');
          const a=src.indexOf('      const POINTS = [');
          const b=src.indexOf('\n      ];',a);
          if(a<0||b<a) throw Error('grammar list not found');
          const env={};
          vm.runInNewContext(src.slice(a,b)+'\n      ]; globalThis.items = POINTS;',env,{timeout:5000});
          const inventory=env.items.map(p=>({
            id:p.id,title:p.title,
            formation:(p.formation||[]).map(f=>({jp:f.jp,de:f.de,highlight:f.highlight,note:f.note}))
          }));
          fs.mkdirSync('.review-audit',{recursive:true});
          fs.writeFileSync('.review-audit/grammar-points.json',JSON.stringify(inventory,null,2));
          const p=src.indexOf('function particlePathBootstrap()');
          const next=src.indexOf('      function startReviews(practiceOnly=false, level=null) {',p);
          const start=src.indexOf('      function buildReviewQuestion(item, practiceOnly=false) {',p);
          if(p<0||next<0||start<0) throw Error('particle boundaries missing');
          fs.writeFileSync('.review-audit/particle-builder.txt',src.slice(start,next));
          fs.writeFileSync('.review-audit/particle-definitions.txt',src.slice(p,Math.min(start,p+28000)));
          const par=src.indexOf('      const R = (surface, reading =',p);
          const ps=src.indexOf('      const POINTS = [',par);
          const pe=src.indexOf('\n      ];',ps);
          if(par<0||ps<0||pe<0) throw Error('particle points not found');
          const pn={};
          vm.runInNewContext(src.slice(par,pe)+'\n      ]; globalThis.items=POINTS;',pn,{timeout:5000});
          fs.writeFileSync('.review-audit/particle-points.json',JSON.stringify(pn.items.map(z=>({
            id:z.id,particle:z.particle,accepted:z.accepted,distractors:z.distractors,
            examples:z.examples.map(e=>({before:e.before.map(v=>v[0]).join(''),after:e.after.map(v=>v[0]).join(''),de:e.de,note:e.note}))
          })),null,2));
          const wrong=src.indexOf('P("nitaishite-target"',p);
          if(wrong<0) throw Error('target not found');
          fs.writeFileSync('.review-audit/nitaishite-target.txt',src.slice(wrong,wrong+2600));
          NODE
      - name: Commit inventory to inspection branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .review-audit
          git diff --cached --stat
          git commit -m "chore: inspect grammar and particle bank on feature branch"
          git push origin HEAD:feat/grammar-bank-batch3-audit
