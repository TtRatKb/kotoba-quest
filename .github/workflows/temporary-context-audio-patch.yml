name: Temporary guarded context audio patch
on:
  push:
    branches:
      - fix/context-practice-audio-20261017

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch only the known cloud audio functions
        run: python3 scripts/apply_context_audio_fix.py
      - name: Run regression checks
        run: node --test tests/review-ui-audio.test.mjs
      - name: Check patch integrity
        run: git diff --check
      - name: Commit to isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cloud.html
          git diff --cached --quiet && { echo "Expected cloud.html patch missing"; exit 1; }
          git commit -m "fix: cancel stale free-practice sentence autoplay"
          git push origin HEAD:refs/heads/fix/context-practice-audio-20261017
