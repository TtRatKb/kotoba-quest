name: Temporary guarded review UX patch
on:
  push:
    branches:
      - feature/applied-reviews-safe-20261018
    paths:
      - .github/workflows/temporary-applied-reviews.yml
permissions:
  contents: write
jobs:
  patch-cloud-on-isolated-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply guarded patch against audited source blob
        run: node scripts/kq-apply-review-ux-patch.mjs
      - name: Run old and new regression checks
        run: node --test tests/review-ui-audio.test.mjs tests/applied-particle-review.test.mjs
      - name: Check formatting and scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "cloud.html"
      - name: Commit only checked cloud changes to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud.html
          git commit -m "feat: applied particle reviews and direct overview links"
          git push origin HEAD:feature/applied-reviews-safe-20261018
