name: Review UI regression

on:
  pull_request:
    paths:
      - "index.html"
      - "cloud.html"
      - "tests/review-ui-audio.test.mjs"
      - "tests/applied-particle-review.test.mjs"
      - "tests/grammar-review-ux.test.mjs"
      - "tests/applied-grammar-kanji.test.mjs"
      - "tests/grammar-bank-coverage.test.mjs"
      - "tests/grammar-temporal-bank.test.mjs"
      - "tests/grammar-temporal-batch3.test.mjs"
      - "tests/particle-bank-quality.test.mjs"
      - "grammar/temporal-review-bank-batch3.json"
      - ".github/workflows/review-ui-regression.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "cloud.html"
      - "tests/review-ui-audio.test.mjs"
      - "tests/applied-particle-review.test.mjs"
      - "tests/grammar-review-ux.test.mjs"
      - "tests/applied-grammar-kanji.test.mjs"
      - "tests/grammar-bank-coverage.test.mjs"
      - "tests/grammar-temporal-bank.test.mjs"
      - "tests/grammar-temporal-batch3.test.mjs"
      - "tests/particle-bank-quality.test.mjs"
      - "grammar/temporal-review-bank-batch3.json"
      - ".github/workflows/review-ui-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
