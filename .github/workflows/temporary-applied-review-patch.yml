name: Temporary guarded applied-review patch
on:
  push:
    branches:
      - feat/applied-grammar-kanji-reviews-20261018
    paths:
      - ".github/workflows/temporary-applied-review-patch.yml"
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact cloud baseline and apply scoped changes
        run: node tools/apply-applied-reviews.cjs
      - name: Run complete regression suite
        run: node --test tests/*.test.mjs
      - name: Validate only intended changes and remove temporary helpers
        run: |
          rm -f tools/apply-applied-reviews.cjs
          rm -f .github/workflows/temporary-applied-review-patch.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: contextual grammar practice and rotating Kanji directions"
          git push origin HEAD:feat/applied-grammar-kanji-reviews-20261018
